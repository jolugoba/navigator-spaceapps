apiVersion: v1
kind: Namespace
metadata:
  name: navigator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: navigator-nginx-conf
  namespace: navigator
data:
  nginx.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # Unity WebGL requiere estos headers para SharedArrayBuffer (multithreading)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # Service Worker
        location = /ServiceWorker.js {
            add_header Service-Worker-Allowed "/";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        # manifest PWA
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # Archivos Unity comprimidos - Unity loader los descomprime, nginx NO debe agregar Content-Encoding
        location ~* \.unityweb$ {
            default_type application/octet-stream;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # JS del loader
        location ~* \.loader\.js$ {
            default_type application/javascript;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cache-Control "no-cache";
        }

        # Assets estaticos con cache largo
        location /TemplateData/ {
            add_header Cache-Control "public, max-age=604800";
        }

        # Todo lo demas - no hacer redirect, Unity WebGL es una sola pagina
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        gzip on;
        gzip_types text/plain text/css application/javascript application/json;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigator-space
  namespace: navigator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navigator-space
  template:
    metadata:
      labels:
        app: navigator-space
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: webgl-files
          mountPath: /usr/share/nginx/html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: webgl-files
        hostPath:
          path: /opt/navigator-space/webgl
          type: Directory
      - name: nginx-conf
        configMap:
          name: navigator-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: navigator-space
  namespace: navigator
spec:
  type: NodePort
  selector:
    app: navigator-space
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30845
